<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Казино</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <!-- Страница: ДОМ -->
        <div id="home" class="page active">
            <h1>Мои Питомцы</h1>
            <div id="pet-list" class="pet-grid">
                <!-- Сюда JS добавит питомцев -->
            </div>
        </div>

        <!-- Страница: ГАЧА -->
        <div id="gacha" class="page">
            <h1>Гача</h1>
            <div class="gacha-container">
                <div class="pity-list">
                    До Красного: <span id="p-red">50</span> | До Синего: <span id="p-blue">3</span>
                </div>
                <div id="gacha-res">Жми крутить!</div>
                <button id="spin-1-btn">x1</button>
                <button id="spin-10-btn">x10</button>
                <hr>
                <div class="shop">
                    <button onclick="buy(1)">+1 (100🍓)</button>
                    <button onclick="buy(5)">+5 (500🍓)</button>
                    <button onclick="buy(10)">+10 (1к🍓)</button>
                    <button onclick="buy(100)">+100 (10к🍓)</button>
                </div>
            </div>
            <div class="stats">
                Клубника: <span id="strawberry-count-gacha">0</span>
            </div>
        </div>

        <!-- Страница: ИГРА (КЛИКЕР) -->
        <div id="game" class="page">
            <h2 id="lvl-display">Уровень 1</h2>
            <div class="clicker-container">
                <img src="strawberry.png" alt="strawberry" id="collect-btn">
                <button id="upgrade-btn">Улучшить (10 🍓)</button>
                <div class="stats">
                    🍓 <span id="strawberry-count">0</span>
                </div>
            </div>
        </div>

        <!-- Страница: ПРОФИЛЬ -->
        <div id="profile" class="page">
            <h1>Профиль</h1>
            <div class="profile-card">
                <p>Клубника: <span id="profile-strawberry">0</span></p>
                <p>Крутки: <span id="profile-spins">0</span></p>
                <hr>
                <input type="text" id="promo-input" placeholder="Введите промокод">
                <button id="apply-promo">ОК</button>
            </div>
        </div>

        <!-- НИЖНЯЯ НАВИГАЦИЯ -->
        <nav class="bottom-nav">
            <div class="nav-item active" id="home-btn">🏠 <span>Дом</span></div>
            <div class="nav-item" id="gacha-btn">🎰 <span>Гача</span></div>
            <div class="nav-item" id="game-btn">🍓 <span>Игра</span></div>
            <div class="nav-item" id="profile-btn">👤 <span>Профиль</span></div>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
