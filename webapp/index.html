<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Казино</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
       <!-- Страница ДОМ -->
        <div id="home" class="page active">
    <h2>Моя Коллекция</h2>
    <div id="inventory-grid"></div>
        </div>

        <!-- Страница: ГАЧА -->
        <div id="gacha" class="page">
    <div class="pity-info">Красный: <span id="p-red">50</span> | Синий: <span id="p-blu">3</span></div>
    <div class="user-spins">🌀 Круток: <span id="spin-count">0</span></div>
    <div id="gacha-res">Жми крутить!</div>
    <button id="spin-1">x1</button>
    <button id="spin-10">x10</button>
    <div class="shop">
        <h3>Клубника: <span id="gacha-straw">0</span></h3>
        <button onclick="buy(1)">+1</button>
        <button onclick="buy(10)">+10</button>
    </div>
</div>
        <!-- Страница: ИГРА (КЛИКЕР) -->
        <div id="game" class="page">
    <h2 id="lvl-display">Уровень 1</h2>
    <img src="assets/strawberry.png" id="collect-btn" width="180">
    <div class="stats">🍓 <span id="straw-count">0</span></div>
    <button id="upgrade-btn">Улучшить (10 🍓)</button>
        </div>

        <!-- Страница: ПРОФИЛЬ -->
        <div id="profile" class="page">
            <h1>Профиль</h1>
            <div class="profile-card">
                <p>Клубника: <span id="straw-count">0</span></p>
                <p>Крутки: <span id="profile-spins">0</span></p>
                <hr>
                <input type="text" id="promo-input" placeholder="Введите промокод">
                <button id="apply-promo">ОК</button>
            </div>
        </div>

        <!-- НИЖНЯЯ НАВИГАЦИЯ -->
        <nav class="bottom-nav">
            <div class="nav-item active" id="home-btn">🏠 <span>Дом</span></div>
            <div class="nav-item" id="gacha-btn">🎰 <span>Гача</span></div>
            <div class="nav-item" id="game-btn">🍓 <span>Игра</span></div>
            <div class="nav-item" id="profile-btn">👤 <span>Профиль</span></div>
        </nav>
    </div>
    <script src="script.js"></script>
    
    <!-- Оверлей для гачи -->
<div id="gacha-overlay" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:999; color:white; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <div id="anim-box"><img id="gacha-gif" src="assets/red.gif" width="200"></div>
    <div id="res-card" class="hidden">
        <img id="res-img" src="" width="200" style="border-radius:20px;">
        <h2 id="res-name"></h2>
        <button onclick="closeGacha()" style="padding:10px 20px; margin-top:20px;">Забрать</button>
    </div>
</div>
</body>
</html>
