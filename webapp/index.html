<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Казино</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        
        <!-- ДОМ (ИНВЕНТАРЬ) -->
        <div id="home-view" class="view active">
            <h1>Мои Питомцы</h1>
            <div id="inventory-list" class="pet-grid">
                <!-- Сюда попадут питомцы -->
            </div>
        </div>

        <!-- ГАЧА -->
        <div id="gacha-view" class="view">
            <h1>Гача</h1>
            <div class="spins-box">Круток: <span class="val-spins">0</span></div>
            
            <div class="banners">
                <button id="banner-1" class="banner-btn active" onclick="setBanner(1)">Феникс</button>
                <button id="banner-2" class="banner-btn" onclick="setBanner(2)">Цербер</button>
            </div>

            <div class="spin-buttons">
                <button onclick="spin(1)" class="btn-spin">Крутить x1</button>
                <button onclick="spin(10)" class="btn-spin">Крутить x10</button>
            </div>

            <div class="shop">
                <p>Купить за клубнику (<span class="val-strawberry">0</span>):</p>
                <div class="buy-grid">
                    <button onclick="buySpins(1)">+1 (100)</button>
                    <button onclick="buySpins(5)">+5 (500)</button>
                    <button onclick="buySpins(10)">+10 (1000)</button>
                    <button onclick="buySpins(50)">+50 (5000)</button>
                    <button onclick="buySpins(100)">+100 (10000)</button>
                </div>
            </div>
        </div>

        <!-- ИГРА (КЛИКЕР) -->
        <div id="clicker-view" class="view">
            <h1 class="pink-text">Уровень <span class="val-level">1</span></h1>
            <div class="clicker-container">
                <img src="assets/strawberry.png" class="strawberry-main" onclick="clickStrawberry()">
            </div>
            <div class="strawberry-text">Клубника: <span class="val-strawberry">0</span></div>
            <button id="upgrade-btn" class="btn-upgrade" onclick="upgradeClicker()">Улучшить (10)</button>
        </div>

        <!-- ПРОФИЛЬ -->
        <div id="profile-view" class="view">
            <div class="profile-card">
                <img id="profile-avatar" src="assets/default_avatar.png" class="avatar">
                <h2 id="profile-username">Загрузка...</h2>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><span>Винрейт Leg</span><b id="stat-winrate">0%</b></div>
                <div class="stat-card"><span>Средняя Leg</span><b id="stat-avg-red">0</b></div>
                <div class="stat-card"><span>Потрачено 🍓</span><b id="stat-spent-straw">0</b></div>
                <div class="stat-card"><span>Потрачено 🌀</span><b id="stat-spent-spins">0</b></div>
            </div>

            <button class="btn-collection" onclick="openCollection()">Открыть коллекцию</button>

            <div class="promo-box">
                <input type="text" id="promo-input" placeholder="Промокод...">
                <button onclick="claimPromo()">ОК</button>
            </div>
        </div>

        <!-- НАВИГАЦИЯ (БЕЗ КАРТИНОК) -->
        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="showView('home-view')">Дом</button>
            <button class="nav-btn" onclick="showView('gacha-view')">Гача</button>
            <button class="nav-btn" onclick="showView('clicker-view')">Игра</button>
            <button class="nav-btn" onclick="showView('profile-view')">Профиль</button>
        </nav>
    </div>

    <!-- ОВЕРЛЕИ -->
    <div id="gacha-overlay" class="overlay hidden">
        <div id="anim-box"><img id="gacha-gif" src=""></div>
        <div id="res-card" class="hidden">
            <img id="res-img" src="">
            <h2 id="res-name"></h2>
            <p id="res-rarity"></p>
            <button onclick="document.getElementById('gacha-overlay').classList.add('hidden')">Забрать</button>
        </div>
    </div>

    <div id="collection-overlay" class="overlay hidden">
        <div class="modal">
            <h2>Коллекция</h2>
            <div id="collection-grid" class="pet-grid"></div>
            <button onclick="document.getElementById('collection-overlay').classList.add('hidden')">Закрыть</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
