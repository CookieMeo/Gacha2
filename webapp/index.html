<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gacha Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <!-- Страница: ДОМ -->
        <div id="home" class="page active">
            <h1>Мои Питомцы</h1>
            <div id="pet-list" class="pet-grid">
                <!-- Сюда JS добавит питомцев -->
            </div>
        </div>

        <!-- Страница: ГАЧА -->
        <div id="gacha" class="page">
            <h1>Гача-автомат</h1>
            <div class="gacha-container">
                <img src="roulette.gif" alt="Gacha" id="gacha-img">
                <div id="gacha-result">Нажми "Крутить"!</div>
                <button id="spin-btn">Крутить (100 🍓)</button>
            </div>
            <div class="stats">
                Клубника: <span id="strawberry-count-gacha">0</span>
            </div>
        </div>

        <!-- Страница: ИГРА (КЛИКЕР) -->
        <div id="game" class="page">
            <h1>Сбор клубники</h1>
            <div class="clicker-container">
                <img src="strawberry.png" alt="Strawberry" id="collect-btn">
                <div class="stats">
                    🍓 <span id="strawberry-count">0</span>
                </div>
            </div>
        </div>

        <!-- Страница: ПРОФИЛЬ -->
        <div id="profile" class="page">
            <h1>Профиль</h1>
            <div class="profile-card">
                <p>Клубника: <span id="profile-strawberry">0</span></p>
                <p>Крутки: <span id="profile-spins">0</span></p>
                <hr>
                <input type="text" id="promo-input" placeholder="Введите промокод">
                <button id="apply-promo">ОК</button>
            </div>
        </div>

        <!-- НИЖНЯЯ НАВИГАЦИЯ -->
        <nav class="bottom-nav">
            <div class="nav-item active" id="home-btn">🏠 <span>Дом</span></div>
            <div class="nav-item" id="gacha-btn">🎰 <span>Гача</span></div>
            <div class="nav-item" id="game-btn">🍓 <span>Игра</span></div>
            <div class="nav-item" id="profile-btn">👤 <span>Профиль</span></div>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
